<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskAI">

  <title>TaskAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "SF Pro Text", Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .header {
      background: #111827;
      color: white;
      padding: 55px 22px 25px;
      border-radius: 0 0 24px 24px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .header p {
      color: #cbd5e1;
      font-size: 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .input-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
      margin-bottom: 22px;
    }

    .task-input {
      width: 100%;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      outline: none;
      font-size: 17px;
      padding: 13px;
      background: #f9fafb;
      color: #111827;
      margin-bottom: 14px;
    }

    .task-input:focus {
      border-color: #9ca3af;
    }

    .time-label {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 6px;
      display: block;
    }

    .time-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .time-input {
      flex: 1;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      font-size: 16px;
      background: #f9fafb;
      color: #111827;
    }

    .arrow {
      color: #9ca3af;
      font-weight: 600;
    }

    .add-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      margin-top: 15px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-button:active {
      transform: scale(0.98);
    }

    .section-title {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #9ca3af;
      background: white;
      border-radius: 18px;
    }

    .task {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 13px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .check {
      width: 25px;
      height: 25px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .check.completed {
      background: #111827;
      border-color: #111827;
      color: white;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      font-size: 17px;
      font-weight: 600;
      word-wrap: break-word;
    }

    .task-time {
      font-size: 14px;
      color: #6b7280;
      margin-top: 5px;
    }

    .completed .task-name {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete {
      border: none;
      background: transparent;
      color: #9ca3af;
      font-size: 22px;
      cursor: pointer;
      padding: 5px;
    }

    .delete:hover {
      color: #ef4444;
    }

    .install-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-top: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .install-card h3 {
      margin-bottom: 8px;
      font-size: 17px;
    }

    .install-card p {
      color: #6b7280;
      line-height: 1.5;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>TaskAI</h1>
    <p>Your simple personal task assistant</p>
  </div>

  <main class="container">

    <div class="input-card">

      <input
        id="taskInput"
        class="task-input"
        type="text"
        placeholder="What do you need to do?"
        autocomplete="off"
      >

      <label class="time-label">Start Time</label>
      <input
        id="startTime"
        class="time-input"
        type="time"
      >

      <div style="height: 12px;"></div>

      <label class="time-label">End Time</label>
      <input
        id="endTime"
        class="time-input"
        type="time"
      >

      <button class="add-button" onclick="addTask()">
        Add Task
      </button>

    </div>

    <h2 class="section-title">Your Schedule</h2>

    <div id="taskList"></div>

    <div class="install-card">
      <h3>📱 Add TaskAI to your Home Screen</h3>
      <p>
        In Safari, tap the Share button and choose
        <strong>Add to Home Screen</strong>.
      </p>
    </div>

  </main>

  <script>
    const taskInput = document.getElementById("taskInput");
    const startTime = document.getElementById("startTime");
    const endTime = document.getElementById("endTime");
    const taskList = document.getElementById("taskList");

    let tasks = JSON.parse(localStorage.getItem("taskai_tasks")) || [];

    function saveTasks() {
      localStorage.setItem("taskai_tasks", JSON.stringify(tasks));
    }

    function formatTime(time) {

      if (!time) {
        return "No time set";
      }

      const parts = time.split(":");
      let hour = parseInt(parts[0]);
      const minute = parts[1];

      const ampm = hour >= 12 ? "PM" : "AM";

      if (hour === 0) {
        hour = 12;
      } else if (hour > 12) {
        hour -= 12;
      }

      return hour + ":" + minute + " " + ampm;
    }

    function renderTasks() {

      taskList.innerHTML = "";

      if (tasks.length === 0) {

        taskList.innerHTML = `
          <div class="empty">
            No tasks yet.<br>
            Add your first task above.
          </div>
        `;

        return;
      }

      tasks.sort(function(a, b) {
        return a.startTime.localeCompare(b.startTime);
      });

      tasks.forEach(function(task, index) {

        const taskElement = document.createElement("div");

        taskElement.className =
          task.completed ? "task completed" : "task";

        taskElement.innerHTML = `
          <div
            class="check ${task.completed ? "completed" : ""}"
            onclick="toggleTask(${index})"
          >
            ${task.completed ? "✓" : ""}
          </div>

          <div class="task-content">

            <div class="task-name">
              ${escapeHTML(task.name)}
            </div>

            <div class="task-time">
              🕐 ${formatTime(task.startTime)}
              →
              ${formatTime(task.endTime)}
            </div>

          </div>

          <button
            class="delete"
            onclick="deleteTask(${index})"
          >
            ×
          </button>
        `;

        taskList.appendChild(taskElement);
      });
    }

    function addTask() {

      const name = taskInput.value.trim();
      const start = startTime.value;
      const end = endTime.value;

      if (name === "") {
        alert("Please enter a task.");
        return;
      }

      if (start === "") {
        alert("Please choose a start time.");
        return;
      }

      if (end === "") {
        alert("Please choose an end time.");
        return;
      }

      if (end <= start) {
        alert("The end time must be after the start time.");
        return;
      }

      const newTask = {
        name: name,
        startTime: start,
        endTime: end,
        completed: false
      };

      tasks.push(newTask);

      saveTasks();

      taskInput.value = "";
      startTime.value = "";
      endTime.value = "";

      renderTasks();
    }

    function toggleTask(index) {

      tasks[index].completed =
        !tasks[index].completed;

      saveTasks();

      renderTasks();
    }

    function deleteTask(index) {

      tasks.splice(index, 1);

      saveTasks();

      renderTasks();
    }

    function escapeHTML(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;
    }

    taskInput.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        addTask();
      }

    });

    renderTasks();
  </script>

</body>
</html>
